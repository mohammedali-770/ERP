# Proposed requirements — originating outside the PRD
#
# HAND-MAINTAINED. This file is not generated.
#
# requirements.yaml is generated from the source PRD, so a requirement that did
# not come from the PRD cannot be added to it. This register holds those, with
# the same validation, until the Product Owner folds them into the next PRD
# revision — at which point they receive permanent identifiers and are removed
# from here.
#
# Identifier form: <MODULE>-P<NN>. The `P` marks it as PROPOSED and NOT YET
# APPROVED, and the form cannot collide with the PRD's <MODULE>-<NNN>.
#
# A proposed requirement carries no authority. It is a specified intention,
# traceable and reviewable, awaiting approval through the same route as any other
# requirement (PRG-015).

version: 1

requirements:

  # ---------------------------------------------------------------------------
  # Abandoned-call automatic callback
  #
  # Requested 2026-09-17. Recovers callers who gave up waiting in a queue by
  # calling them back once an agent is free — unless they have since ordered
  # through any channel, and only while the intent is still fresh.
  #
  # The PRD mentions abandoned calls only as a metric (CC-007). This is new
  # behaviour and is therefore proposed rather than assumed.
  # ---------------------------------------------------------------------------

  - id: "CC-P01"
    module: "CC"
    proposed_phase: "F2"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-17"
    status: "proposed"
    text_en: "The system shall record an abandoned call when a caller leaves a queue before being connected to an agent, retaining the caller's number, the time of abandonment, the queue and the wait duration."
    text_ar: "يجب أن يسجل النظام المكالمة المتروكة عندما يغادر المتصل قائمة الانتظار قبل توصيله بموظف، مع الاحتفاظ برقم المتصل ووقت الترك وقائمة الانتظار ومدة الانتظار."
    test_refs:
      - SPIKE-callback-engine
    relates_to:
      - CC-007

  - id: "CC-P02"
    module: "CC"
    proposed_phase: "F2"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-17"
    status: "proposed"
    text_en: "An abandoned call shall be queued for automatic callback, and at most one open callback entry shall exist for a caller number at any time."
    text_ar: "يجب إدراج المكالمة المتروكة في قائمة معاودة اتصال تلقائية، وألا يوجد أكثر من سجل معاودة مفتوح واحد لرقم المتصل في أي وقت."
    test_refs:
      - SPIKE-callback-engine
    relates_to:
      - CC-P01

  - id: "CC-P03"
    module: "CC"
    proposed_phase: "F2"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-17"
    status: "proposed"
    text_en: "A callback shall not be placed if an order has been received from the same normalized mobile number through any channel since the time of abandonment, and this condition shall be evaluated immediately before dialling rather than when the entry is queued."
    text_ar: "يجب عدم إجراء معاودة الاتصال إذا استلم طلب من رقم الجوال المعياري نفسه عبر أي قناة منذ وقت ترك المكالمة، ويجب التحقق من هذا الشرط مباشرة قبل الاتصال وليس عند إدراج السجل."
    test_refs:
      - SPIKE-callback-engine
    relates_to:
      - APP-004
      - OMS-001

  - id: "CC-P04"
    module: "CC"
    proposed_phase: "F2"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-17"
    status: "proposed"
    text_en: "A callback shall not be placed once a configurable staleness window has elapsed since the abandonment; expired entries shall be closed with a reason and retained for reporting."
    text_ar: "يجب عدم إجراء معاودة الاتصال بعد انقضاء مهلة قابلة للضبط منذ ترك المكالمة، وتغلق السجلات المنتهية مع بيان السبب وتحفظ لأغراض التقارير."
    test_refs:
      - SPIKE-callback-engine
    relates_to:
      - CC-P02

  - id: "CC-P05"
    module: "CC"
    proposed_phase: "F2"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-17"
    status: "proposed"
    text_en: "A callback shall be placed only when an agent is available, and shall connect the agent before dialling the customer so that the customer does not answer to silence."
    text_ar: "يجب ألا تجرى معاودة الاتصال إلا عند توفر موظف، وأن يوصل الموظف قبل الاتصال بالعميل حتى لا يرد العميل على صمت."
    test_refs:
      - SPIKE-callback-engine
    relates_to:
      - CC-005

  - id: "CC-P06"
    module: "CC"
    proposed_phase: "F2"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-17"
    status: "proposed"
    text_en: "Each abandoned call shall receive at most one automatic callback attempt; an unanswered attempt shall be closed and recorded rather than retried."
    text_ar: "يجب ألا تتلقى المكالمة المتروكة أكثر من محاولة معاودة تلقائية واحدة، وتغلق المحاولة غير المجابة وتسجل بدلا من إعادة المحاولة."
    test_refs:
      - SPIKE-callback-engine
    relates_to:
      - CC-P02

  - id: "CC-P07"
    module: "CC"
    proposed_phase: "F2"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-17"
    status: "proposed"
    text_en: "Callbacks shall not be placed outside configured operating hours, and an entry whose staleness window elapses outside those hours shall expire rather than being deferred."
    text_ar: "يجب عدم إجراء معاودات الاتصال خارج ساعات العمل المضبوطة، وينتهي السجل الذي تنقضي مهلته خارج تلك الساعات بدلا من تأجيله."
    test_refs:
      - SPIKE-callback-engine
    relates_to:
      - CC-P04

  - id: "CC-P08"
    module: "CC"
    proposed_phase: "F2"
    proposed_priority: "P2"
    origin: "Product Owner request, 2026-09-17"
    status: "proposed"
    text_en: "Callback outcomes shall be reportable alongside abandoned-call metrics, including the recovery rate and the reason each entry was closed."
    text_ar: "يجب أن تكون نتائج معاودة الاتصال قابلة للتقرير مع مقاييس المكالمات المتروكة، بما في ذلك نسبة الاسترجاع وسبب إغلاق كل سجل."
    test_refs:
      - SPIKE-callback-engine
    relates_to:
      - CC-007

  # ---------------------------------------------------------------------------
  # Ratings and feedback
  #
  # Requested 2026-09-18. Customers rate their experience; management sees how
  # branches, cashiers and drivers are doing.
  #
  # Four decisions shape every requirement below, taken 2026-09-18:
  #   1. PURPOSE IS RECOGNITION AND COACHING ONLY. No automatic consequence.
  #   2. Customers rate the SERVICE, not a named employee. Attribution is internal.
  #   3. Computed measures and manager judgement stay separate, never merged.
  #   4. Staff see their own ratings and may contest one.
  #
  # The PRD has performance MEASUREMENT (DLV-009, CC-007, HR-014) but no ratings,
  # and nothing customer-submitted about individuals. This is new behaviour.
  # ---------------------------------------------------------------------------

  - id: "RTG-P01"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "Customers shall be able to rate a completed order across defined experience dimensions, and shall not rate a named individual employee."
    text_ar: "يجب أن يتمكن العملاء من تقييم الطلب المكتمل وفق أبعاد تجربة محددة، دون تقييم موظف بعينه بالاسم."
    relates_to:
      - CRM-009

  - id: "RTG-P02"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "Each rating shall be tied to exactly one completed order, a customer shall be able to submit at most one rating per order, and ratings shall be accepted only within a configurable window after completion."
    text_ar: "يجب أن يرتبط كل تقييم بطلب مكتمل واحد فقط، وألا يقدم العميل أكثر من تقييم واحد لكل طلب، وألا تقبل التقييمات إلا خلال مهلة قابلة للضبط بعد الإكمال."
    relates_to:
      - OMS-001

  - id: "RTG-P03"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "Each rating dimension shall attribute only to the roles that could affect it, using a recorded and configurable mapping, so that no role is scored on an outcome outside its control."
    text_ar: "يجب أن ينسب كل بعد من أبعاد التقييم إلى الأدوار القادرة على التأثير فيه فقط، وفق ربط موثق وقابل للضبط، بحيث لا يقيم أي دور على نتيجة خارجة عن سيطرته."
    test_refs:
      - SPIKE-rating-statistics
    relates_to:
      - DLV-009

  - id: "RTG-P04"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "No score shall be displayed for an individual until a configurable minimum number of ratings has been received; below that threshold the system shall report insufficient data rather than a score."
    text_ar: "يجب عدم عرض أي تقييم لفرد قبل بلوغ حد أدنى قابل للضبط من عدد التقييمات، ويعرض النظام دون هذا الحد عبارة بيانات غير كافية بدلا من درجة."
    test_refs:
      - SPIKE-rating-statistics
    relates_to:
      - RPT-011

  - id: "RTG-P05"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "Every displayed aggregate shall carry its sample size and a measure of uncertainty, and comparison or ranking shall never be based on a raw mean alone."
    text_ar: "يجب أن يصاحب كل متوسط معروض حجم العينة ومقياس لعدم اليقين، وألا تعتمد المقارنة أو الترتيب على المتوسط الحسابي وحده."
    test_refs:
      - SPIKE-rating-statistics
    relates_to:
      - RPT-011
      - RPT-012

  - id: "RTG-P06"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P2"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "The response rate shall be recorded and displayed alongside any aggregate, and aggregates with materially different response rates shall not be presented as directly comparable."
    text_ar: "يجب تسجيل نسبة الاستجابة وعرضها مع أي متوسط، وألا تعرض المتوسطات ذات نسب الاستجابة المختلفة جوهريا على أنها قابلة للمقارنة المباشرة."
    relates_to:
      - RPT-012

  - id: "RTG-P07"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P2"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "A rating submitted together with a complaint or refund request shall be flagged as such and reported separately, because it is not an independent observation."
    text_ar: "يجب وسم التقييم المقدم مع شكوى أو طلب استرداد والإبلاغ عنه بشكل منفصل، لأنه ليس ملاحظة مستقلة."
    relates_to:
      - CRM-007

  - id: "RTG-P08"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "System-computed operational measures and manager assessments shall be retained and presented separately, and shall never be combined into a single score."
    text_ar: "يجب الاحتفاظ بالمقاييس التشغيلية المحسوبة آليا وتقييمات المدير وعرضها بشكل منفصل، وعدم دمجها في درجة واحدة."
    relates_to:
      - HR-014
      - DLV-009

  - id: "RTG-P09"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "An employee shall be able to see the ratings attributed to them, in aggregate and without any customer identity being disclosed."
    text_ar: "يجب أن يتمكن الموظف من الاطلاع على التقييمات المنسوبة إليه بشكل إجمالي ودون الكشف عن هوية أي عميل."
    relates_to:
      - DLV-010
      - SEC-005

  - id: "RTG-P10"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "An employee shall be able to contest a rating attributed to them with evidence; the original rating shall remain auditable and the outcome of the challenge shall be recorded."
    text_ar: "يجب أن يتمكن الموظف من الاعتراض على تقييم منسوب إليه مع تقديم الأدلة، مع بقاء التقييم الأصلي قابلا للتدقيق وتسجيل نتيجة الاعتراض."
    relates_to:
      - AI-019

  - id: "RTG-P11"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P0"
    origin: "Product Owner decision, 2026-09-18"
    status: "proposed"
    text_en: "Ratings shall not automatically cause any pay, disciplinary, scheduling or work-allocation consequence; any such use requires a separate approved decision and human authorization."
    text_ar: "يجب ألا تتسبب التقييمات تلقائيا في أي أثر على الأجر أو الإجراءات التأديبية أو الجدولة أو توزيع العمل، وأي استخدام من هذا النوع يتطلب قرارا معتمدا مستقلا وتفويضا بشريا."
    relates_to:
      - HR-016
      - AI-011

  - id: "RTG-P12"
    module: "RTG"
    proposed_phase: "F5"
    proposed_priority: "P1"
    origin: "Product Owner request, 2026-09-18"
    status: "proposed"
    text_en: "The identity and contact details of a rating customer shall not be disclosed to the rated employee at any time, including after the order is complete."
    text_ar: "يجب عدم الكشف عن هوية العميل المقيم وبيانات تواصله للموظف المقيم في أي وقت، بما في ذلك بعد اكتمال الطلب."
    relates_to:
      - DLV-010

  # ---------------------------------------------------------------------------
  # Administrator-controlled capability exposure
  #
  # Requested 2026-10-01. An administrator exposes capabilities that are finished
  # and fit to use, and withholds those still under construction, without a
  # deployment and without hiding being mistaken for a control.
  #
  # The PRD has no requirement for this: IAM-003 and IAM-006 govern what a *user*
  # may do, which is a different axis from whether a capability is open at all.
  # So this is new behaviour and is proposed rather than assumed.
  #
  # Written deliberately WITHOUT reference to the warehouse system, the
  # consolidation seam, retirement dates or any "estate" notion. PRG-015 makes a
  # promoted identifier's meaning permanent, and encoding a temporary migration
  # into the baseline is how a bridge becomes furniture. Capability exposure is a
  # permanent platform capability; the migration is not.
  #
  # Context: ADR-0020, docs/program/consolidation-plan.md Phase 2.
  # No test_refs yet: the harness and its control case are Phase 2 deliverables,
  # and naming an artifact before it exists is the defect req-lint's
  # test-refs-resolve rule was built to catch.
  # ---------------------------------------------------------------------------

  - id: "CAP-P01"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "The system shall maintain a register of capabilities, each identified by a stable key, named in Arabic and English, and recording the requirements it delivers."
    text_ar: "يجب أن يحتفظ النظام بسجل للقدرات، لكل منها مفتاح ثابت واسم بالعربية والإنجليزية، مع تسجيل المتطلبات التي تحققها."

  - id: "CAP-P02"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "Each capability shall carry an administrator-set lifecycle state from a fixed set — not built, pilot, available, read only, withdrawn — and a capability with no recorded state shall resolve to not built."
    text_ar: "يجب أن تحمل كل قدرة حالة دورة حياة يحددها المسؤول من مجموعة ثابتة — غير مبنية، تجريبية، متاحة، للقراءة فقط، مسحوبة — وأي قدرة بلا حالة مسجلة تُعدّ غير مبنية."

  - id: "CAP-P03"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "Every change to a capability's state shall be an appended decision record carrying the actor, the time, the scope and a stated reason, and the current state shall be derived from those records rather than overwritten."
    text_ar: "يجب أن يكون كل تغيير في حالة قدرة سجلا مُضافا للقرار يحمل الفاعل والوقت والنطاق وسببا مذكورا، وأن تُستنتج الحالة الحالية من تلك السجلات بدلا من استبدالها."

  - id: "CAP-P04"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "A capability that is not available shall refuse new commands in the database itself, and the removal of a menu entry or a screen shall never be the only control preventing its use."
    text_ar: "يجب أن ترفض القدرة غير المتاحة الأوامر الجديدة في قاعدة البيانات نفسها، ولا يجوز أن يكون إخفاء عنصر قائمة أو شاشة هو الضابط الوحيد الذي يمنع استخدامها."

  - id: "CAP-P05"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "Closing a capability shall not prevent work already accepted from completing, from synchronising, or from being recorded, and no accepted event shall be discarded because the capability that produced it was later closed."
    text_ar: "لا يجوز أن يمنع إغلاق قدرة إتمام عمل تم قبوله بالفعل أو مزامنته أو تسجيله، ولا يجوز إلغاء أي حدث مقبول لأن القدرة التي أنتجته أُغلقت لاحقا."

  - id: "CAP-P06"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "The historical data of a withdrawn or read-only capability shall remain readable to users authorised for it, and shall not be hidden by the same control that stops new work."
    text_ar: "يجب أن تبقى البيانات التاريخية لقدرة مسحوبة أو للقراءة فقط قابلة للقراءة للمستخدمين المصرح لهم بها، ولا يجوز إخفاؤها بالضابط نفسه الذي يوقف العمل الجديد."

  - id: "CAP-P07"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "Capability dependencies shall be recorded, and the system shall refuse a state change that would leave an available capability without a capability it depends on."
    text_ar: "يجب تسجيل الاعتماديات بين القدرات، وأن يرفض النظام أي تغيير حالة يترك قدرة متاحة بلا قدرة تعتمد عليها."

  - id: "CAP-P08"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "Capabilities required to administer capabilities, identity and audit shall be designated protected and shall not be closable through the application."
    text_ar: "يجب تصنيف القدرات اللازمة لإدارة القدرات والهوية والتدقيق كقدرات محمية، ولا يجوز إغلاقها من خلال التطبيق."

  - id: "CAP-P09"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "A capability shall not be set generally available until the evidence for the requirements it delivers can be produced, and the system shall name the missing evidence when it refuses."
    text_ar: "لا يجوز جعل قدرة متاحة للجميع قبل أن يكون بالإمكان إنتاج الدليل على المتطلبات التي تحققها، وعلى النظام أن يسمي الدليل الناقص عند الرفض."

  - id: "CAP-P10"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "A branch operating without central connectivity shall apply the last capability state it received, and shall refuse new commands for a capability whose state is older than a configured limit rather than assuming it is open."
    text_ar: "يجب أن يطبق الفرع العامل دون اتصال مركزي آخر حالة قدرات وصلته، وأن يرفض الأوامر الجديدة لقدرة حالتها أقدم من حد مُعَد بدلا من افتراض أنها مفتوحة."
    relates_to:
      - OFF-001

  - id: "CAP-P11"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "Where an administrator previews the system as another role, the preview shall apply that role's capability state and permissions and shall be read only, and shall be identified as a preview wherever it is shown."
    text_ar: "عند معاينة المسؤول للنظام بدور آخر، يجب أن تطبق المعاينة حالة القدرات والصلاحيات الخاصة بذلك الدور وأن تكون للقراءة فقط، وأن يُبيَّن أنها معاينة في كل موضع تظهر فيه."
    relates_to:
      - IAM-003

  - id: "CAP-P12"
    module: "CAP"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner request, 2026-10-01"
    status: "proposed"
    text_en: "Capability states and every change to them shall be recorded in the audit log with actor, scope, the values before and after, and the stated reason, and shall be reportable."
    text_ar: "يجب تسجيل حالات القدرات وكل تغيير فيها في سجل التدقيق مع الفاعل والنطاق والقيم قبل وبعد والسبب المذكور، وأن تكون قابلة للتقرير."

  # ---------------------------------------------------------------------------
  # Branch-worker sign-in and the identity lifecycle
  #
  # Added 2026-10-02 with consolidation Phase 3. IAM-001 says employees sign in
  # with an employee ID and a PASSWORD. Branch staff on a shared till sign in with
  # a short numeric PIN instead, which IAM-001 does not describe — so it is
  # proposed here rather than read into IAM-001, which stays untouched (owner's
  # decision, 2026-10-02).
  #
  # The PIN design itself is proven: lockout after five misses, and unknown numbers
  # that answer exactly as wrong PINs do. Written, like the CAP block, without
  # reference to the system it was learned from, because a promoted identifier's
  # meaning is permanent (PRG-015).
  #
  # Context: ADR-0022, docs/program/consolidation-plan.md Phase 3. The pgTAP suite
  # supabase/tests/070_identity_test.sql exercises every one of these, but pgTAP
  # suites are not an artifact type req-lint resolves, so no test_refs are named.
  # ---------------------------------------------------------------------------

  - id: "IAM-P01"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-02"
    status: "proposed"
    text_en: "Branch staff shall be able to sign in on a shared device with their employee number and a personal identification number, without an email address or password."
    text_ar: "يجب أن يتمكن موظفو الفرع من تسجيل الدخول على جهاز مشترك برقمهم الوظيفي ورقم تعريف شخصي، دون بريد إلكتروني أو كلمة مرور."
    relates_to:
      - IAM-001

  - id: "IAM-P02"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-02"
    status: "proposed"
    text_en: "A sign-in attempt with an employee number that does not exist, or that has no PIN, shall receive the same response, the same remaining-attempt count and the same lockout as a wrong PIN for an employee number that does exist."
    text_ar: "يجب أن تتلقى محاولة تسجيل الدخول برقم وظيفي غير موجود، أو ليس له رقم تعريف شخصي، الاستجابة نفسها وعدد المحاولات المتبقية نفسه والقفل نفسه الذي يتلقاه رقم تعريف خاطئ لرقم وظيفي موجود."

  - id: "IAM-P03"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-02"
    status: "proposed"
    text_en: "Five consecutive failed sign-in attempts shall lock the employee number for fifteen minutes, during which even a correct PIN shall be refused, and an administrator shall be able to lift the lock with a recorded reason."
    text_ar: "يجب أن تؤدي خمس محاولات فاشلة متتالية لتسجيل الدخول إلى قفل الرقم الوظيفي لمدة خمس عشرة دقيقة يُرفض خلالها حتى رقم التعريف الصحيح، وأن يتمكن المسؤول من رفع القفل مع سبب مسجل."

  - id: "IAM-P04"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-02"
    status: "proposed"
    text_en: "A PIN shall be exactly six digits, shall be stored only as a salted one-way hash, and shall never be stored, displayed, logged or recorded in clear."
    text_ar: "يجب أن يتكون رقم التعريف الشخصي من ست خانات رقمية بالضبط، وأن يُخزن فقط كتجزئة أحادية الاتجاه مملحة، وألا يُخزن أو يُعرض أو يُسجل أو يُدون بنص صريح أبدا."
    relates_to:
      - SEC-003

  - id: "IAM-P05"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-02"
    status: "proposed"
    text_en: "A suspended or terminated account shall not be able to sign in or be granted any permission, whatever credential or role it still holds."
    text_ar: "لا يجوز لحساب موقوف أو منتهٍ تسجيل الدخول أو منحه أي صلاحية، أيا كانت بيانات الاعتماد أو الأدوار التي ما زال يحملها."
    relates_to:
      - IAM-009

  - id: "IAM-P06"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-02"
    status: "proposed"
    text_en: "An identity that any record names as its actor shall be disabled rather than deleted, so that every record continues to name who performed it."
    text_ar: "يجب تعطيل الهوية التي يسميها أي سجل فاعلا له بدلا من حذفها، بحيث يستمر كل سجل في تسمية من قام به."
    relates_to:
      - IAM-008

  - id: "IAM-P07"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-02"
    status: "proposed"
    text_en: "The first administrator, or a replacement when no administrator is active, shall be created only through a recorded bootstrap that is refused while an active administrator exists, and the last active administrator shall not be removable through the application."
    text_ar: "يجب ألا يُنشأ المسؤول الأول، أو بديله عند عدم وجود مسؤول نشط، إلا من خلال تهيئة مسجلة تُرفض ما دام يوجد مسؤول نشط، ولا يجوز إزالة آخر مسؤول نشط من خلال التطبيق."
    relates_to:
      - CAP-P08

  - id: "IAM-P08"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-02"
    status: "proposed"
    text_en: "The application runtime and reporting access shall hold no privilege to read a stored credential; verification shall be performed by the database and shall return only an outcome."
    text_ar: "لا يجوز أن تملك بيئة تشغيل التطبيق ولا صلاحيات التقارير أي امتياز لقراءة بيانات اعتماد مخزنة؛ ويجب أن تتم المصادقة داخل قاعدة البيانات وأن تعيد النتيجة فقط."
    relates_to:
      - SEC-003
      - SEC-004

  # ---------------------------------------------------------------------------
  # Sessions (ADR-0025). IAM-P09's two numbers are the owner's (2026-10-03);
  # IAM-P10 is what makes ADR-0022's open gap close: a caller cannot name the actor.
  # supabase/tests/090_sessions_test.sql exercises both, and the Node suite under
  # supabase/functions/_shared/test holds IAM-P10's second half; neither is an
  # artifact type req-lint resolves, so no test_refs are named.
  # ---------------------------------------------------------------------------

  - id: "IAM-P09"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner decision, 2026-10-03"
    status: "proposed"
    text_en: "A sign-in session shall end no later than twelve hours after it began, and after thirty minutes without use, and shall be refused from then on."
    text_ar: "يجب أن تنتهي جلسة تسجيل الدخول بعد اثنتي عشرة ساعة على الأكثر من بدايتها، وبعد ثلاثين دقيقة دون استخدام، وأن تُرفض بعد ذلك."
    relates_to:
      - IAM-010
      - IAM-P01

  - id: "IAM-P10"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P0"
    origin: "Owner-approved plan, 2026-10-03"
    status: "proposed"
    text_en: "A session token shall be shown only once, to the device that signed in, and stored only as a one-way hash; the person a request acts as shall be resolved from its token and never taken from the request."
    text_ar: "يجب ألا يُعرض رمز الجلسة إلا مرة واحدة للجهاز الذي سجّل الدخول، وألا يُخزَّن إلا كقيمة تجزئة أحادية الاتجاه؛ ويجب أن يُستخلص الشخص الذي يعمل الطلب باسمه من رمزه، وألا يؤخذ من الطلب نفسه أبداً."
    relates_to:
      - IAM-008
      - SEC-003
      - IAM-P08

  # ---------------------------------------------------------------------------
  # Where a branch worker may order from
  #
  # Owner decision, 2026-10-05 (ADR-0028 §2). The warehouse let a phone's position
  # choose the branch a worker ordered for. The owner chose assignment, as every role
  # is here (IAM-006), plus a check that the phone is inside the branch's area. No PRD
  # requirement covers a location check, so it is proposed. pgTAP 140 and db-check
  # exercise the check; neither is an artifact type req-lint resolves.
  # ---------------------------------------------------------------------------

  - id: "IAM-P11"
    module: "IAM"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner decision, 2026-10-05"
    status: "proposed"
    text_en: "A branch worker shall order for a branch only if assigned to it and only while their device reports a position, precise to 100 metres or better, inside that branch's area; the position shall be used for the check and not retained by it."
    text_ar: "يجب ألا يطلب موظف الفرع لفرع إلا إذا كان معيّناً عليه، وما دام جهازه يُبلغ عن موقع داخل نطاق ذلك الفرع بدقة ١٠٠ متر أو أفضل؛ ويُستخدم الموقع للتحقق فقط ولا يُحتفظ به لأجله."
    relates_to:
      - IAM-006
      - SEC-001

  # ---------------------------------------------------------------------------
  # Stock: the business day of a movement, and negative stock
  #
  # Owner decisions, 2026-10-05 (ADR-0029 D3 and D1). The PRD asks that every movement
  # record its date (INV-007) and that negative stock be "prevented or explicitly
  # controlled through an exception approval policy" (INV-008); it says neither which
  # day a warehouse movement belongs to, nor what the control is. Both are new behaviour,
  # so both are proposed. pgTAP 150 and db-check exercise them; neither is an artifact
  # type req-lint resolves.
  # ---------------------------------------------------------------------------

  - id: "INV-P01"
    module: "INV"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner decision, 2026-10-05"
    status: "proposed"
    text_en: "A stock movement at a warehouse or a factory shall belong to the calendar date, in the facility's time zone, of the moment it happened; a movement entered late shall state that moment, and no movement shall be dated at or before the last count of the item at that facility."
    text_ar: "يجب أن تُنسب حركة المخزون في المستودع أو المصنع إلى التاريخ التقويمي، بتوقيت المنشأة، للحظة التي حدثت فيها؛ ويجب أن تذكر الحركة المُدخلة متأخرةً تلك اللحظة، وألا تؤرَّخ أي حركة في وقت آخر جرد للصنف في تلك المنشأة أو قبله."
    test_refs:
      - UAT-stock
    relates_to:
      - INV-007
      - INV-009

  - id: "INV-P02"
    module: "INV"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner decision, 2026-10-05"
    status: "proposed"
    text_en: "A stock movement that takes stock out of an item at a facility and would leave its stock there below zero shall be refused unless a person permitted to override it records it with a stated reason; a count shall never be refused for the balance it leaves, and a balance below zero shall be shown as such."
    text_ar: "يجب رفض حركة المخزون التي تُخرج كمية من صنف في منشأة وتجعل رصيده فيها أقل من الصفر، ما لم يسجلها شخص مخوَّل بالتجاوز مع ذكر السبب؛ ولا يُرفض الجرد أبداً بسبب الرصيد الذي يتركه، ويُعرض الرصيد الأقل من الصفر على حقيقته."
    test_refs:
      - UAT-stock
    relates_to:
      - INV-008

  # ---------------------------------------------------------------------------
  # Notifications: who is told, how long it is kept, and what tells them first
  #
  # Owner decisions, 2026-10-06 (ADR-0030 N2 to N4). The PRD asks that notification
  # recipient rules prevent disclosure through an inappropriate channel (SUP-007), and
  # for alerts with ownership and deduplication (SUP-005); it says neither who the
  # recipients are, how long a notification is kept, nor what raises one. All three are
  # new behaviour, so all three are proposed. pgTAP 160 and db-check exercise them;
  # neither is an artifact type req-lint resolves. The staff testing pack
  # (UAT-notifications) evidences SUP-P03 whole. It exercises SUP-P01 and SUP-P02
  # without evidencing them: a session cannot show what a row stores, a person's access
  # changing, or anything 90 days old. So it is cited on SUP-P03 alone.
  # ---------------------------------------------------------------------------

  - id: "SUP-P01"
    module: "SUP"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner decision, 2026-10-06"
    status: "proposed"
    text_en: "A notification shall go only to the people who may open what it is about, at the facility where it happened, decided when it happens; it shall be shown to a person only while they still may, it shall hold no name or free text, and the person whose action raised it shall not be told of it."
    text_ar: "يجب ألا يُرسل الإشعار إلا إلى الأشخاص المخوَّلين بفتح ما يتعلق به، في المنشأة التي حدث فيها، ويُحدَّد ذلك عند وقوعه؛ ولا يُعرض على الشخص إلا ما دام مخوَّلاً بذلك، ولا يحمل أي اسم أو نص حر، ولا يُبلَّغ به الشخص الذي تسبب فعله فيه."
    relates_to:
      - SUP-007
      - SUP-005

  - id: "SUP-P02"
    module: "SUP"
    proposed_phase: "F1"
    proposed_priority: "P2"
    origin: "Owner decision, 2026-10-06"
    status: "proposed"
    text_en: "A notification shall be kept for 90 days and then deleted; until then it shall never be changed except to be marked read once by its recipient, and it shall not be shown once 90 days have passed."
    text_ar: "يجب الاحتفاظ بالإشعار ٩٠ يوماً ثم حذفه؛ وحتى ذلك الحين لا يُغيَّر أبداً إلا بتعليمه مقروءاً مرة واحدة من قِبل مستلمه، ولا يُعرض بعد مرور ٩٠ يوماً."
    relates_to:
      - SUP-005
      - SUP-006

  - id: "SUP-P03"
    module: "SUP"
    proposed_phase: "F1"
    proposed_priority: "P1"
    origin: "Owner decision, 2026-10-06"
    status: "proposed"
    text_en: "When a permitted person overrides the refusal of a stock movement that takes an item below zero at a facility, stating a reason, the people who may read that facility's stock shall be notified in the application, naming each item the movement took out and left below zero and the balance it left; a count, which is never refused, shall not raise this notification."
    text_ar: "عندما يتجاوز شخص مخوَّل رفض حركة مخزون تجعل رصيد صنف أقل من الصفر في منشأة، مع ذكر السبب، يجب إشعار الأشخاص المخوَّلين بقراءة مخزون تلك المنشأة داخل التطبيق، مع ذكر كل صنف أخرجته الحركة وأصبح رصيده أقل من الصفر والرصيد الذي تركته؛ ولا يُصدر الجرد، الذي لا يُرفض أبداً، هذا الإشعار."
    test_refs:
      - UAT-notifications
    relates_to:
      - INV-P02
      - INV-008
      - SUP-006
