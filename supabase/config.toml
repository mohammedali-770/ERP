# Local development stack — `supabase start`.
#
# LOCAL ONLY. This file describes a container on a developer's machine. It holds
# no credential and is committed deliberately so every machine runs the same
# stack. Staging and production are configured in the hosted dashboard and in
# the deployment runbook, never here.
#
# See docs/program/supabase-deployment.md.

project_id = "first-taste-erp"

[api]
enabled = true
port = 54321
# Only `public` is exposed through PostgREST, and `public` holds nothing.
# The ERP lives in `erp`, which no API role can reach — see migration 0002 and
# ADR-0018. Adding "erp" here would undo that in one line.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
# Listed, not \ir-included from a single file: the CLI sends seed SQL over the
# wire rather than through psql, so a psql meta-command is a syntax error.
# Order matters — the organisation must exist before anything references it, and
# the timestamp freeze must run last.
sql_paths = ["./seeds/0010_organisation.sql", "./seeds/0015_identity.sql", "./seeds/0020_awkward_cases.sql", "./seeds/0030_capability_registry.sql", "./seeds/0035_role_permissions.sql", "./seeds/0040_items.sql", "./seeds/0050_suppliers.sql", "./seeds/0060_transfer_prices.sql", "./seeds/0070_stock.sql", "./seeds/0075_stock_minimums.sql", "./seeds/0080_purchase_orders.sql", "./seeds/0090_freeze_timestamps.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

# Edge functions (ADR-0023, ADR-0025). verify_jwt is off for each: they authenticate
# with the ERP's own session token, not a Supabase Auth JWT, which the ERP does not use
# (ADR-0022). Every function resolves its one dependency through the same pinned,
# locked map; dep:policy refuses a second one.
[functions.sign-in]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.session]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.sign-out]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.items]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.suppliers]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.transfer-prices]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.facilities]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.stock]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.notifications]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.stock-alerts]
verify_jwt = false
import_map = "./functions/deno.json"
